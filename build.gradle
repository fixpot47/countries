plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "countries" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

def generatedFlags = layout.buildDirectory.dir("generated/flag-pack")

tasks.register("prepareCountryFlags") {
    outputs.dir(generatedFlags)

    doLast {
        def outputDir = generatedFlags.get().asFile
        def zipFile = layout.buildDirectory.file("countryflagspack.zip").get().asFile

        outputDir.deleteDir()
        outputDir.mkdirs()
        zipFile.parentFile.mkdirs()

        new URI("https://countryflags-pack.netlify.app/countryflagspack.zip")
                .toURL()
                .withInputStream { input ->
                    zipFile.withOutputStream { output ->
                        output << input
                    }
                }

        copy {
            from zipTree(zipFile)
            into outputDir
            include "**/assets/minecraft/font/**"
            include "**/assets/minecraft/textures/flagprefix/**"
            eachFile { details ->
                int assetsIndex = details.path.indexOf("assets/")
                if (assetsIndex >= 0) {
                    details.path = details.path.substring(assetsIndex)
                }
            }
            includeEmptyDirs = false
        }
    }
}

sourceSets.main.resources.srcDir(generatedFlags)

processResources {
    dependsOn tasks.named("prepareCountryFlags")

    def modVersion = project.version
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
